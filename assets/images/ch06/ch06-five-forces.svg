<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="pff-title" font-family="Inter, Lato, Arial, sans-serif">
<title id="pff-title">Porter's Five Forces. Competitive rivalry sits in the centre. Arrows point into it from the threat of new entrants above, the threat of substitutes below, supplier power on the left and buyer power on the right.</title>
<defs><marker id="pff-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<g font-size="36" font-weight="700" fill="#222" text-anchor="middle">
<rect x="550" y="8" width="400" height="165" rx="16" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="750" y="70">Threat of new entrants</text>
<rect x="550" y="527" width="400" height="165" rx="16" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="750" y="589">Threat of substitutes</text>
<rect x="15" y="267" width="400" height="165" rx="16" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="215" y="329">Supplier power</text>
<rect x="1085" y="267" width="400" height="165" rx="16" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="1285" y="329">Buyer power</text>
<rect x="505" y="245" width="490" height="210" rx="16" fill="#FBF3E2" stroke="#D9A441" stroke-width="5"/><text x="750" y="315">Competitive rivalry</text>
</g>
<g font-size="26" fill="#222" text-anchor="middle">
<text x="750" y="115">How easily can a new firm</text><text x="750" y="150">enter the market?</text>
<text x="750" y="634">Can customers meet the same</text><text x="750" y="669">need by other means?</text>
<text x="215" y="374">Can suppliers raise</text><text x="215" y="409">the firm’s costs?</text>
<text x="1285" y="374">Can customers force prices</text><text x="1285" y="409">down or switch?</text>
<text x="750" y="365">How intensely do existing firms</text><text x="750" y="400">compete on price and service?</text>
</g>
<g stroke="#222" stroke-width="5" fill="none" marker-end="url(#pff-arrow)">
<line x1="750" y1="175" x2="750" y2="238"/><line x1="750" y1="525" x2="750" y2="462"/>
<line x1="417" y1="350" x2="497" y2="350"/><line x1="1083" y1="350" x2="1003" y2="350"/></g></svg>
